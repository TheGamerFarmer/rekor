services:
  backend:
    image: ghcr.io/thegamerfarmer/rekor/backend:latest
    environment:
      - PORT=3000
      - TRUST_PROXY=1
      - MONGODB_URI=mongodb://db:27017
      - MONGODB_DB=${DB_NAME}
      - MONGODB_USER=${DB_USER}
      - MONGODB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-web:
    image: ghcr.io/thegamerfarmer/rekor/frontend-web:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
