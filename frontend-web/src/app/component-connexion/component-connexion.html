<main class="login-page">
  <section class="login-card">
    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="vous@exemple.com"
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.dirty"
          [attr.aria-describedby]="
            loginForm.controls.email.invalid && loginForm.controls.email.dirty
              ? 'email-error'
              : null
          "
        />
        @if (loginForm.controls.email.invalid && loginForm.controls.email.dirty) {
          <p class="error" id="email-error">Saisissez une adresse e-mail valide.</p>
        }
      </div>

      <div class="field">
        <div class="label-row">
          <label for="password">Mot de passe</label>
          <a href="#forgot-password">Mot de passe oublié&nbsp;?</a>
        </div>
        <div class="password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Votre mot de passe"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="
              showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
            "
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Se souvenir de moi</span>
      </label>

      <button class="submit-button" type="submit">Se connecter</button>

      @if (submitted() && loginForm.valid) {
        <p class="form-message" role="status">Vos identifiants sont prêts à être envoyés.</p>
      }
    </form>

    <p class="signup-prompt">
      Vous n’avez pas encore de compte&nbsp;?
      <a routerLink="/inscription">Créer un compte</a>
    </p>
  </section>
</main>
