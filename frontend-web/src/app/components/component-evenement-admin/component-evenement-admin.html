<app-component-banner
  [title]="isEditing() ? 'Modifier un événement' : 'Créer un événement'"
  [subtitle]="
    isEditing()
      ? 'Mettez à jour les informations de cet événement.'
      : 'Ajoutez un rendez-vous à l’agenda du club.'
  "
  image="/images/volley2.jpg"
/>

<main class="admin-event-page">
  <section class="admin-event-card" aria-labelledby="admin-event-title">
    <form [formGroup]="eventForm" (ngSubmit)="save()" novalidate>
      <div class="form-grid">
        <label class="field field-wide" for="name">
          <span>Nom de l'événement <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="name" type="text" formControlName="name" aria-required="true" />
          @if (eventForm.controls.name.invalid && eventForm.controls.name.touched) {
            <small>Le nom est obligatoire.</small>
          }
        </label>

        <label class="field" for="type">
          <span>Type <span class="required-marker" aria-hidden="true">*</span></span>
          <select id="type" formControlName="type" aria-required="true">
            @for (type of eventTypes; track type) {
              <option [value]="type">{{ type }}</option>
            }
          </select>
        </label>

        <label class="field" for="group">
          <span>Groupe <span class="required-marker" aria-hidden="true">*</span></span>
          <input
            id="group"
            type="text"
            formControlName="group"
            placeholder="Ex. Seniors"
            aria-required="true"
          />
        </label>

        <label class="field" for="date">
          <span>Date <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="date" type="date" formControlName="date" aria-required="true" />
        </label>

        <label class="field" for="time">
          <span>Heure <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="time" type="time" formControlName="time" aria-required="true" />
        </label>

        <label class="field field-wide" for="place">
          <span>Lieu <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="place" type="text" formControlName="place" aria-required="true" />
        </label>

        <label class="field field-wide" for="description">
          <span>Description <span class="required-marker" aria-hidden="true">*</span></span>
          <textarea
            id="description"
            rows="5"
            formControlName="description"
            aria-required="true"
          ></textarea>
          @if (eventForm.controls.description.invalid && eventForm.controls.description.touched) {
            <small>La description doit contenir au moins 10 caractères.</small>
          }
        </label>
      </div>

      <div class="actions">
        <app-button variant="secondary" href="/evenements" text="Annuler"></app-button>
        <app-button
          type="submit"
          [text]="isEditing() ? 'Enregistrer les modifications' : 'Enregistrer l’événement'"
        ></app-button>
      </div>
    </form>
  </section>
</main>
