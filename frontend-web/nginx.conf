server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # Les appels /api/* sont transmis au conteneur "backend" (sans le préfixe /api).
  # Le nom est résolu à chaque requête via le DNS de Docker (127.0.0.11) : nginx démarre
  # même si le back n'est pas encore prêt (il répond 502 en attendant).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Application Angular : toute autre URL renvoie index.html (le routage se fait côté navigateur)
  location / {
    try_files $uri $uri/ /index.html;
  }
}