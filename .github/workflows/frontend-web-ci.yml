name: Frontend Web CI

on:
  push:
    paths:
      - 'frontend-web/**'
      - '.github/workflows/frontend-web-ci.yml'
  pull_request:

jobs:
  test:
    name: Front web - test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  build:
    name: Front web - image
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/configuration-CI-CD') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/frontend-web:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}/frontend-web:latest