name: Format

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend-web/**'
      - 'frontend-app/**'
      - '.github/workflows/format.yml'
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    name: Format - JS/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-web/package-lock.json
      # --ignore-scripts : inutile de télécharger mongod ou les navigateurs pour vérifier le formatage
      - name: Install backend
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Install frontend-web
        run: npm ci --ignore-scripts
        working-directory: frontend-web
      - name: Check backend formatting
        run: npm run format:check
        working-directory: backend
      - name: Check frontend-web formatting
        run: npm run format:check
        working-directory: frontend-web

  dart:
    name: Format - Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: frontend-app
