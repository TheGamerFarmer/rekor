name: Frontend App CI (Flutter)

on:
  push:
    paths:
      - 'frontend-app/**'
      - '.github/workflows/frontend-app-ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: App - changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Sur un push, le filtre "paths" du déclencheur a déjà fait le tri.
          # Sur une PR, on regarde si l'app Flutter a changé pour éviter les jobs lourds (macOS, émulateur).
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(frontend-app/|\.github/workflows/frontend-app-ci\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: App - android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: frontend-app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: App - iOS build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend-app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip the unsigned .app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v6
        with:
          name: app-release-ios-unsigned
          path: frontend-app/build/ios/iphoneos/Runner.app.zip

  e2e-android:
    name: App - android e2e
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: frontend-app
      - name: Start the real backend (built from this commit)
        run: |
          docker build -t rekor-backend:e2e backend
          docker run -d --rm --name rekor-e2e-backend -p 3000:3000 rekor-backend:e2e
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          echo "Le backend ne répond pas"; docker logs rekor-e2e-backend; exit 1
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: frontend-app
          script: flutter test integration_test

  publish-packages:
    needs: [build-android, build-ios]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/configuration-CI-CD') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: app-release-apk
          path: android-release
      - uses: actions/download-artifact@v7
        with:
          name: app-release-ios-unsigned
          path: ios-release
      - uses: oras-project/setup-oras@v2
      - name: Login to GHCR with oras
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Android APK as OCI artifact
        run: oras push ghcr.io/${{ env.REPO_LC }}/frontend-app-android:latest android-release/app-release.apk
      - name: Push iOS .app as OCI artifact
        run: oras push ghcr.io/${{ env.REPO_LC }}/frontend-app-ios:latest ios-release/Runner.app.zip

  release:
    needs: [build-android, build-ios]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/configuration-CI-CD') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: app-release-apk
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: app-release-ios-unsigned
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          files: release-assets/*
