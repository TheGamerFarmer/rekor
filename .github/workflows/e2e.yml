name: E2E

on:
  push:
    paths:
      - 'frontend-web/**'
      - 'backend/**'
      - '.github/workflows/e2e.yml'
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [mock, real]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend-web
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend-web/package-lock.json') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend-web
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend-web
      - name: Build backend image from this commit
        run: docker build -t rekor-backend:e2e backend
      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
        working-directory: frontend-web
        env:
          BACKEND_IMAGE: rekor-backend:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: frontend-web/playwright-report/
          retention-days: 14
