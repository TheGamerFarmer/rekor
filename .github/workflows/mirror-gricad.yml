name: Mirror to GRICAD

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GRICAD (with retries)
        env:
          GRICAD_TOKEN: ${{ secrets.GRICAD_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git remote add gricad "https://oauth2:${GRICAD_TOKEN}@gricad-gitlab.univ-grenoble-alpes.fr/iut2-info-stud/2026-s5/sae5a/team3/rendus.git"

          attempts=5
          delay=10
          for attempt in $(seq 1 "$attempts"); do
            if output=$(git push gricad "HEAD:${BRANCH}" --force 2>&1); then
              echo "$output"
              echo "Push réussi (tentative ${attempt}/${attempts})"
              exit 0
            fi
            echo "$output"

            # Un jeton refusé ne se répare pas en réessayant : on s'arrête tout de suite
            if echo "$output" | grep -qiE 'authentication failed|access denied|returned error: 40[13]'; then
              echo "::error::GRICAD a refusé le jeton (GRICAD_TOKEN expiré, ou sans droit d'écriture ?)"
              exit 1
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "Échec de la tentative ${attempt}/${attempts}, nouvel essai dans ${delay} s..."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          echo "::error::Le push vers GRICAD a échoué après ${attempts} tentatives"
          exit 1
