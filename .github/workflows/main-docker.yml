name: Main docker construct

on:
  push:
    branches: [main, configuration-CI-CD]
    paths:
      - 'docker-compose.prod.yml'
      - '.github/workflows/main-docker.yml'
  workflow_run:
    workflows: ["Backend CI", "Frontend Web CI"]
    types: [completed]
    branches: [main, configuration-CI-CD]

jobs:
  publish:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish compose stack to GHCR
        run: docker compose -f docker-compose.prod.yml publish -y ghcr.io/thegamerfarmer/rekor:latest