version: 2

updates:
  # --- Back (Express) ---
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # --- Front web (Angular) : les paquets Angular montent de version ensemble ---
  - package-ecosystem: npm
    directory: /frontend-web
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      minor-and-patch:
        update-types: [minor, patch]

  # --- App (Flutter) ---
  - package-ecosystem: pub
    directory: /frontend-app
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # --- Images de base des Dockerfiles (node, nginx) ---
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend-web
    schedule:
      interval: weekly

  # --- Actions des workflows (.github/workflows) ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
